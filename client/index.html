<!doctype html>
<!-- lang is the default (shared/site.ts SITE.lang). scripts/prerender.mjs
     rewrites this attribute per page, so an article whose posts.lang is
     not the site language ships with its own. Keep the attribute exactly
     one double-quoted value long — the substitution asserts that shape
     and fails the build if it changes. -->
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!--app-head-->

    <!-- No hay <link rel=preload> del hero escrito a mano aquí a propósito.
         React 19 emite uno solo, por página, a partir del propio
         <img fetchPriority="high"> de HeroCarousel.tsx, con el mismo
         srcset y el mismo sizes por construcción — así no pueden
         desajustarse nunca. El que había aquí vivía en la plantilla
         compartida, así que se colaba en /blog, /contact, /partner, las
         cuatro legales, el 404 y los dos shells, donde no hay hero: el
         navegador descargaba la variante y no la usaba, que es el aviso
         "preloaded but not used" de consola. Si alguna vez se quita ese
         fetchPriority, el preload desaparece con él. -->
    <!-- Matches manifest.json's theme_color (scripts/prerender.mjs) — both are
         the Lynx assistant's own primaryColor, so browser chrome, the PWA
         launcher and the chat agree on one color. Update both together. -->
    <meta name="theme-color" content="#403911" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Both font stylesheets load without blocking the first paint.
         They used to be plain <link rel=stylesheet>, which meant the
         browser could not paint a single pixel until two third-party
         CSS files had been fetched over two fresh connections —
         Lighthouse costed that at ~300ms locally and ~1,050ms on the
         deployed site, all of it in front of FCP and therefore in front
         of LCP too.

         rel=preload fetches the CSS at high priority without blocking
         rendering; the onload handler promotes it to a real stylesheet
         the moment it arrives. Both URLs already carry display=swap, so
         text was always going to be painted in the fallback face first
         and swapped — this changes when the swap happens, not whether.
         The <noscript> copies keep the fonts working with JS disabled. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" />
    </noscript>
    <link rel="preconnect" href="https://api.fontshare.com" />
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--chat-widget-start-->
    <!--
      Lynx chat bubble. Deliberately NOT a plain <script src ... defer> tag.

      `defer` still makes the browser fetch the third party during initial
      page load, on a page already sitting at ~50/100 on mobile Lighthouse —
      it competes with the LCP image for bandwidth on a phone. This loader
      injects it only once the visitor shows intent (first scroll) or after
      3s of idle, whichever comes first, so it can never be in flight while
      the hero is still painting.

      It also refuses to inject at all until the 21+ ConsentGate has been
      accepted. That is the *only* reliable way to keep the chat behind the
      gate: Lynx pins its bubble at z-index 2147483647 — the 32-bit maximum
      — as an inline !important style, which outranks anything an author
      stylesheet can say, so no modal can ever be layered above it. The
      bubble simply must not exist yet. (ChatWidgetRouteGate.tsx clamps it
      back down to 30 once it does.)

      The `null` below is replaced with the real config by
      scripts/prerender.mjs, from SITE in shared/site.ts — one place to edit
      the key. The dev server does the same substitution via the
      chat-widget-config plugin in vite.config.ts. If it is ever left
      unsubstituted, cfg stays null and this whole block quietly does
      nothing rather than injecting a broken script tag.
    -->
    <script>
      (function () {
        var cfg = /* __CHAT_WIDGET_CONFIG__ */ null;
        if (!cfg || !cfg.src || !cfg.apiKey) return;

        var path = location.pathname.replace(/\/+$/, "") || "/";
        for (var i = 0; i < cfg.hiddenRoutes.length; i++) {
          var route = cfg.hiddenRoutes[i];
          if (path === route || path.indexOf(route + "/") === 0) return;
        }

        var timer = null;
        var injected = false;

        function inject() {
          if (injected) return;
          injected = true;
          window.removeEventListener("scroll", inject);
          if (timer) clearTimeout(timer);
          var script = document.createElement("script");
          script.src = cfg.src;
          script.async = true;
          script.setAttribute("data-api-key", cfg.apiKey);
          document.body.appendChild(script);
        }

        function arm() {
          window.addEventListener("scroll", inject, { once: true, passive: true });
          timer = setTimeout(inject, 3000);
        }

        function hasConsent() {
          try {
            var raw = localStorage.getItem(cfg.consent.storageKey);
            if (!raw) return false;
            var parsed = JSON.parse(raw);
            return parsed.accepted === true && parsed.version === cfg.consent.version;
          } catch (err) {
            // localStorage unavailable (private browsing): treat as no
            // consent. The gate will ask again, and this waits for it.
            return false;
          }
        }

        if (hasConsent()) {
          arm();
        } else {
          // Dispatched by ConsentGate.tsx the moment "I agree and enter" is
          // accepted, so a first-time visitor still gets the bubble in the
          // same session without a reload.
          window.addEventListener("sunny:consent-accepted", arm, { once: true });
        }
      })();
    </script>
    <!--chat-widget-end-->
  </body>

</html>
