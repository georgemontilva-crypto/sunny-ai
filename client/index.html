<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />

    <!--app-head-->

    <!-- ── Non-SEO head (static, kept) ──────────────────────────────── -->
    <meta name="keywords" content="péptidos, investigación de péptidos, consultora de péptidos, biohacking, longevidad" />
    <meta name="author" content="Sunny" />

    <!-- ── Theme & PWA ────────────────────────────────────────────────── -->
    <!-- noche (#14100A) en oklch — color de marca, no un azul heredado -->
    <meta name="theme-color" content="oklch(0.1759 0.0135 77.72)" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Favicon ───────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- ── Preconnects (performance) ─────────────────────────────────── -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Fonts: Boska (display), Switzer (cuerpo) vía Fontshare; JetBrains Mono (datos) vía Google Fonts ── -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=boska@500,600,700&f[]=switzer@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
